name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: URL profile
        required: true
        default: githubPages
        type: choice
        options:
          - githubPages
          - customDomain
      site_version:
        description: Version to deploy
        required: true
        default: fullSite
        type: choice
        options:
          - fullSite
          - comingSoon

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ inputs.deploy_target }}
      SITE_VERSION: ${{ inputs.site_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
